name: Release

# Changesets release for a yarn workspace repo, published with trusted
# publishing and staged on npm: every version waits for a 2FA approval.
# npm matches the *caller's* workflow file, so the trusted publisher of a
# package calling this is `<owner>/<repo>` / `main.yml`, stage only.
# The caller job grants `contents: write`, `pull-requests: write` and
# `id-token: write`; each job below narrows them.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '26'
      version-script:
        type: string
        default: 'yarn changeset version'
      jsr:
        description: also `deno publish` the deno.json workspace
        type: boolean
        default: false
      snapshot-branch:
        description: stage a snapshot (dist-tag `snapshot`) on every push to this branch
        type: string
        default: ''

jobs:
  # opens the "Version Packages" PR while changesets are pending
  version:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      # persist-credentials stays on: changesets/action pushes the
      # "Version Packages" branch with the checked-out credentials
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - run: yarn install --immutable
      - run: yarn build
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: ${{ inputs.version-script }}

  # once that PR is merged: stages on npm, publishes to JSR and creates the
  # GitHub release; lzear-publish skips a version already released
  publish:
    needs: version
    if: needs.version.outputs.hasChangesets == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn lzear-publish --publish --release
        env:
          GH_TOKEN: ${{ github.token }}
      - if: inputs.jsr
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - if: inputs.jsr
        run: deno publish

  # snapshot versions are unique per push: no PR, no release. Their own
  # dist-tag keeps them off `beta`/`rc`, which changesets pre mode publishes
  snapshot:
    if: inputs.snapshot-branch != '' && github.ref_name == inputs.snapshot-branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn changeset version --snapshot snapshot
      - run: yarn lzear-publish --publish
