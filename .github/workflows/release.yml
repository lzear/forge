name: Release

# Changesets release for a yarn workspace repo, published with trusted
# publishing and staged on npm: every version waits for a 2FA approval.
# npm matches the *caller's* workflow file, so the trusted publisher of a
# package calling this is `<owner>/<repo>` / `main.yml`, stage only.
# The caller job grants `contents: write`, `pull-requests: write` and
# `id-token: write`; each job below narrows them.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '26'
      version-script:
        type: string
        default: 'yarn changeset version'
      jsr:
        description: also `deno publish` each deno.json workspace member
        type: boolean
        default: false

jobs:
  # opens the "Version Packages" PR while changesets are pending
  version:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      # persist-credentials stays on: changesets/action pushes the
      # "Version Packages" branch with the checked-out credentials
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - run: yarn install --immutable
      - run: yarn build
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: ${{ inputs.version-script }}

  # once that PR is merged: stages on npm, publishes to JSR and creates the
  # GitHub release; lzear-publish skips a version already released
  publish:
    needs: version
    if: needs.version.outputs.hasChangesets == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn lzear-publish --publish --release
        env:
          GH_TOKEN: ${{ github.token }}
      - if: inputs.jsr
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      # one `deno publish` per member, its workspace deps first: each fetches
      # its own OIDC token, which a slow publish before it can't outlive
      - if: inputs.jsr
        shell: bash
        run: |
          node -e '
            const { existsSync: exists, readFileSync: read } = require("node:fs")
            const json = (f) => JSON.parse(read(f, "utf8"))
            const dirs = json("deno.json").workspace
            const byName = new Map(dirs.map((d) => [json(`${d}/deno.json`).name, d]))
            const done = new Set()
            const visit = (d) => {
              if (done.has(d)) return
              done.add(d)
              const p = exists(`${d}/package.json`) ? json(`${d}/package.json`) : {}
              for (const n of Object.keys({ ...p.dependencies, ...p.peerDependencies }))
                if (byName.has(n)) visit(byName.get(n))
              console.log(d)
            }
            dirs.forEach(visit)
          ' | while read -r dir; do
            (cd "$dir" && deno publish)
          done
