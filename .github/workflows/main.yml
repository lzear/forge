name: Main

on:
  push:
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - id: changesets
        uses: changesets/action@v1
        with:
          version: yarn version-packages
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          for workspace in packages/configs packages/eslint-config packages/forge packages/repo-lint; do
            name=$(node -p "require('./${workspace}/package.json').name")
            version=$(node -p "require('./${workspace}/package.json').version")
            if npm view "${name}@${version}" version 2>/dev/null | grep -qF "${version}"; then
              echo "${name}@${version} already published, skipping"
            else
              npm publish --workspace="${workspace}" --access public --provenance
            fi
          done
        env:
          NPM_CONFIG_PROVENANCE: 'true'
