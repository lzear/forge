name: Main

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

  # exercises actions/setup (consumers use it as lzear/forge/actions/setup@<sha>)
  action-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: ./actions/setup
      - run: yarn --version

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      # persist-credentials stays on: changesets/action pushes the
      # "Version Packages" branch with the checked-out credentials
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - id: changesets
        uses: changesets/action@v2
        with:
          version-script: yarn version-packages
          createGithubReleases-script: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.changesets.outputs.hasChangesets == 'false'
        run: yarn lzear-publish --publish
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          NPM_TOKEN: '' # Empty string forces OIDC instead of token auth

      # publishes every member of the deno.json workspace; versions come from
      # the Version Packages PR, which runs lzear-sync-jsr after changeset version
      - if: steps.changesets.outputs.hasChangesets == 'false'
        run: deno publish
