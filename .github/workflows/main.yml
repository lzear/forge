name: Main

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

  # exercises actions/setup (consumers use it as lzear/forge/actions/setup@<sha>)
  action-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/setup
      - run: yarn --version

  release:
    if: github.event_name == 'push'
    needs: ci
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    with:
      version-script: yarn version-packages
      jsr: true
