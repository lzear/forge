name: CI

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '26'
      coverage-command:
        type: string
        default: 'yarn test --coverage'
      run-check:
        type: boolean
        default: true
    secrets:
      CODACY_PROJECT_TOKEN:
        required: false

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_CODACY_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # corepack first so setup-node's cache detection resolves the
      # packageManager-pinned yarn, not the runner's preinstalled one
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn typecheck
      - run: yarn lint
      - run: ${COVERAGE_COMMAND}
        env:
          COVERAGE_COMMAND: ${{ inputs.coverage-command }}
      - run: yarn forge check --skip-remote
        if: ${{ inputs.run-check }}
        continue-on-error: true
      # advisory: annotates duplication and complexity, `forge check` gates dead code
      - uses: fallow-rs/fallow@3f6d4a5f817525d322365d64953940ff47175bf2 # v3.9.1
        continue-on-error: true
        with:
          command: dupes
          fail-on-issues: false
          branded-token: false
      # fallow takes one coverage file; without one it scores every function
      # as untested. Istanbul maps are keyed by file, so merging is a union.
      - name: merge coverage for fallow
        id: fallow-coverage
        run: |
          files=$(find . -name node_modules -prune -o -name coverage-final.json -print)
          [ -z "$files" ] && exit 0
          out="$RUNNER_TEMP/coverage-final.json"
          jq -s add $files > "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
      - uses: fallow-rs/fallow@3f6d4a5f817525d322365d64953940ff47175bf2 # v3.9.1
        continue-on-error: true
        with:
          command: health
          coverage: ${{ steps.fallow-coverage.outputs.path }}
          fail-on-issues: false
          branded-token: false
      # advisory: annotates e18e's lighter/native alternatives and publint hints,
      # minus duplicate deps (dozens per repo, mostly transitive)
      - name: e18e analyze
        continue-on-error: true
        run: |
          out="$RUNNER_TEMP/e18e.json"
          npx --yes @e18e/cli@0.7.0 analyze --json --log-level error --report-level info > "$out"
          jq -r '.messages[]
            | select(.message | startswith("[duplicate dependency]") | not)
            | "::\(if .severity == "error" or .severity == "warning" then .severity else "notice" end) title=e18e::\(.message | gsub("\n"; "%0A"))"' "$out"
      - name: collect coverage paths
        id: coverage
        run: |
          paths=$(find . -name node_modules -prune -o -name lcov.info -print | paste -sd, -)
          echo "paths=$paths" >> $GITHUB_OUTPUT
      - uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        if: env.HAS_CODACY_TOKEN == 'true' && steps.coverage.outputs.paths != ''
        continue-on-error: true
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ${{ steps.coverage.outputs.paths }}

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          advanced-security: false
