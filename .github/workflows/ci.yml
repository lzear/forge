name: CI

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '26'
      coverage-command:
        description: defaults to `yarn test --coverage`, or `bun test --coverage --coverage-reporter=lcov` in a Bun repo
        type: string
        default: ''
      run-check:
        type: boolean
        default: true
    secrets:
      CODACY_PROJECT_TOKEN:
        required: false

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_CODACY_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # a bun lockfile makes it a Bun repo, anything else a yarn one
      - name: detect package manager
        id: pm
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            pm=bun run='bun run' install='bun install --frozen-lockfile'
            coverage='bun test --coverage --coverage-reporter=lcov'
          else
            pm=yarn run=yarn install='yarn install --immutable'
            coverage='yarn test --coverage'
          fi
          echo "name=$pm" >> "$GITHUB_OUTPUT"
          {
            echo "RUN=$run"
            echo "INSTALL=$install"
            echo "COVERAGE_COMMAND=${COVERAGE_COMMAND:-$coverage}"
          } >> "$GITHUB_ENV"
        env:
          COVERAGE_COMMAND: ${{ inputs.coverage-command }}
      # corepack first so setup-node's cache detection resolves the
      # packageManager-pinned yarn, not the runner's preinstalled one
      - if: steps.pm.outputs.name == 'yarn'
        run: corepack enable
      # Bun repos still need node: forge, fallow and e18e run on it
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ steps.pm.outputs.name == 'yarn' && 'yarn' || '' }}
      # version from packageManager, else the latest
      - if: steps.pm.outputs.name == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: ${INSTALL}
      - run: ${RUN} build
      - run: ${RUN} typecheck
      - run: ${RUN} lint
      - run: ${COVERAGE_COMMAND}
      - run: ${RUN} forge check --skip-remote
        if: ${{ inputs.run-check }}
        continue-on-error: true
      # advisory: annotates duplication and complexity, `forge check` gates dead code
      - uses: fallow-rs/fallow@71369f80d099e25726ad04382f15aef14a251abc # v3.31.0
        continue-on-error: true
        with:
          command: dupes
          fail-on-issues: false
          branded-token: false
      # fallow takes one coverage file; without one it scores every function
      # as untested. Istanbul maps are keyed by file, so merging is a union.
      - name: merge coverage for fallow
        id: fallow-coverage
        run: |
          files=$(find . -name node_modules -prune -o -name coverage-final.json -print)
          [ -z "$files" ] && exit 0
          out="$RUNNER_TEMP/coverage-final.json"
          jq -s add $files > "$out"
          echo "path=$out" >> "$GITHUB_OUTPUT"
      - uses: fallow-rs/fallow@71369f80d099e25726ad04382f15aef14a251abc # v3.31.0
        continue-on-error: true
        with:
          command: health
          coverage: ${{ steps.fallow-coverage.outputs.path }}
          fail-on-issues: false
          branded-token: false
      # advisory: annotates e18e's lighter/native alternatives and publint hints,
      # minus duplicate deps (dozens per repo, mostly transitive)
      - name: e18e analyze
        continue-on-error: true
        run: |
          out="$RUNNER_TEMP/e18e.json"
          npx --yes @e18e/cli@0.7.0 analyze --json --log-level error --report-level info > "$out"
          jq -r '.messages[]
            | select(.message | startswith("[duplicate dependency]") | not)
            | "::\(if .severity == "error" or .severity == "warning" then .severity else "notice" end) title=e18e::\(.message | gsub("\n"; "%0A"))"' "$out"
      - name: collect coverage paths
        id: coverage
        run: |
          paths=$(find . -name node_modules -prune -o -name lcov.info -print | paste -sd, -)
          echo "paths=$paths" >> $GITHUB_OUTPUT
      - uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        if: env.HAS_CODACY_TOKEN == 'true' && steps.coverage.outputs.paths != ''
        continue-on-error: true
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ${{ steps.coverage.outputs.paths }}

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
