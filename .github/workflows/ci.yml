name: CI

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      coverage-command:
        type: string
        default: 'yarn test --coverage'
      run-check:
        type: boolean
        default: true
    secrets:
      CODACY_PROJECT_TOKEN:
        required: false

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_CODACY_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # corepack first so setup-node's cache detection resolves the
      # packageManager-pinned yarn, not the runner's preinstalled one
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: yarn
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn typecheck
      - run: yarn lint
      - run: ${COVERAGE_COMMAND}
        env:
          COVERAGE_COMMAND: ${{ inputs.coverage-command }}
      - run: yarn forge check --skip-remote
        if: ${{ inputs.run-check }}
        continue-on-error: true
      - name: collect coverage paths
        id: coverage
        run: |
          paths=$(find packages -name 'lcov.info' 2>/dev/null | tr '\n' ',' | sed 's/,$//')
          echo "paths=$paths" >> $GITHUB_OUTPUT
      - uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        if: env.HAS_CODACY_TOKEN == 'true' && steps.coverage.outputs.paths != ''
        continue-on-error: true
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ${{ steps.coverage.outputs.paths }}

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          advanced-security: false
