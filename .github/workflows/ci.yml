name: CI

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      coverage-command:
        type: string
        default: 'yarn test --coverage'
      run-check:
        type: boolean
        default: true
      run-preview:
        type: boolean
        default: true
      preview-packages:
        type: string
        default: './packages/*'
    secrets:
      CODACY_PROJECT_TOKEN:
        required: false

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      HAS_CODACY_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn typecheck
      - run: yarn lint
      - run: ${{ inputs.coverage-command }}
      - run: yarn forge check --skip-remote
        if: ${{ inputs.run-check }}
        continue-on-error: true
      - name: collect coverage paths
        id: coverage
        run: |
          paths=$(find packages -name 'lcov.info' 2>/dev/null | tr '\n' ',' | sed 's/,$//')
          echo "paths=$paths" >> $GITHUB_OUTPUT
      - uses: codacy/codacy-coverage-reporter-action@v1
        if: env.HAS_CODACY_TOKEN == 'true' && steps.coverage.outputs.paths != ''
        continue-on-error: true
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ${{ steps.coverage.outputs.paths }}

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@v0.5.7
        with:
          advanced-security: false

  preview:
    if: github.event_name == 'pull_request' && inputs.run-preview
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn dlx pkg-pr-new publish ${{ inputs.preview-packages }}
