name: CI

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '26'
      coverage-command:
        description: defaults to `yarn test --coverage`, or `bun test --coverage --coverage-reporter=lcov` in a Bun repo
        type: string
        default: ''
    secrets:
      CODACY_PROJECT_TOKEN:
        required: false

# github.workflow and github.ref are the caller's: one group per caller
# workflow and ref, superseded runs cancelled except on the default branch
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-ci
      cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}
    permissions:
      contents: read
    env:
      HAS_CODACY_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # a bun lockfile makes it a Bun repo, anything else a yarn one
      - name: detect package manager
        id: pm
        run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            pm=bun run='bun run' install='bun install --frozen-lockfile'
            coverage='bun test --coverage --coverage-reporter=lcov'
          else
            pm=yarn run=yarn install='yarn install --immutable'
            coverage='yarn test --coverage'
          fi
          echo "name=$pm" >> "$GITHUB_OUTPUT"
          {
            echo "RUN=$run"
            echo "INSTALL=$install"
            echo "COVERAGE_COMMAND=${COVERAGE_COMMAND:-$coverage}"
          } >> "$GITHUB_ENV"
        env:
          COVERAGE_COMMAND: ${{ inputs.coverage-command }}
      # corepack first so setup-node's cache detection resolves the
      # packageManager-pinned yarn, not the runner's preinstalled one
      - if: steps.pm.outputs.name == 'yarn'
        run: corepack enable
      # Bun repos still need node: bins with a node shebang run on it
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ steps.pm.outputs.name == 'yarn' && 'yarn' || '' }}
      # version from packageManager, else the latest
      - if: steps.pm.outputs.name == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - if: steps.pm.outputs.name == 'bun'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: ${INSTALL}
      - run: ${RUN} build
      - run: ${RUN} typecheck
      - run: ${RUN} lint
      - run: ${COVERAGE_COMMAND}
      - name: collect coverage paths
        id: coverage
        run: |
          paths=$(find . -name node_modules -prune -o -name lcov.info -print | paste -sd, -)
          echo "paths=$paths" >> $GITHUB_OUTPUT
      - uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        if: env.HAS_CODACY_TOKEN == 'true' && steps.coverage.outputs.paths != ''
        continue-on-error: true
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: ${{ steps.coverage.outputs.paths }}

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-zizmor
      cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-gitleaks
      cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, from the release's checksums.txt
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      PUSH_BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # the binary, not gitleaks-action: no license key, no token
      - name: install gitleaks
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
      # a PR scans base..head, a push before..HEAD; a new branch (all-zero
      # before) or another event scans all reachable history
      - name: scan commits
        run: |
          range=()
          if [ -n "$PR_BASE" ]; then
            range=(--log-opts "${PR_BASE}..HEAD")
          elif [ -n "$PUSH_BEFORE" ] && [ "${PUSH_BEFORE//0/}" != "" ]; then
            range=(--log-opts "${PUSH_BEFORE}..HEAD")
          fi
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose "${range[@]}"
