rules:
  unpinned-uses:
    config:
      policies:
        '*': hash-pin
  use-trusted-publishing:
    # pkg-pr-new previews don't support npm trusted publishing
    ignore:
      - ci.yml
  artipacked:
    # the release checkout must keep credentials: changesets/action
    # pushes the "Version Packages" branch with them
    ignore:
      - main.yml
