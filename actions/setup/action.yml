name: forge setup
description: Node.js + corepack + package-manager cache + immutable install

inputs:
  node-version:
    description: Node.js version
    required: false
    default: '26'
  cache:
    description: Package manager cache for setup-node (yarn, npm, pnpm; empty to disable)
    required: false
    default: 'yarn'
  install-command:
    description: Dependency install command
    required: false
    default: 'yarn install --immutable'

runs:
  using: composite
  steps:
    # Node first: it stopped bundling corepack in version 25
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
    - run: npm i -g corepack@0.36.x && corepack enable
      shell: bash
    # setup-node again, now for the cache: its detection must resolve the
    # packageManager-pinned yarn/pnpm, not the runner's preinstalled one
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.cache }}
    - run: ${INSTALL_COMMAND}
      shell: bash
      env:
        INSTALL_COMMAND: ${{ inputs.install-command }}
