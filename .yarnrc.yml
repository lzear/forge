nodeLinker: node-modules
npmMinimalAgeGate: 3d
npmRegistryServer: "https://registry.npmjs.org"
# dependency install scripts stay off; lefthook is installed by `prepare`
enableScripts: false
logFilters:
  # peer bugs inside dependencies (@commitlint/load starves its TS loader):
  # nothing to fix here; the project's own peer warnings still show
  - code: YN0086
    pattern: "*by dependencies*"
    level: discard
