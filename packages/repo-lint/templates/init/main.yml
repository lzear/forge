name: Main

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: lzear/forge/.github/workflows/ci.yml@{{sha}} # {{tag}}
    secrets:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
    with:
      coverage-command: '{{coverage}}'

  release:
    if: github.event_name == 'push'
    needs: ci
    uses: lzear/forge/.github/workflows/release.yml@{{sha}} # {{tag}}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
